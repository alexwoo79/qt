<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>记账本</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, "Noto Sans CJK SC", "Source Han Sans SC", sans-serif;
    font-size: 14px;
    background: #f4f5f7;
    color: #1f2328;
    user-select: none;
  }
  .app {
    display: flex;
    flex-direction: column;
    gap: 12px;
    height: 100%;
    padding: 16px;
  }
  .field {
    height: 34px;
    padding: 0 10px;
    border: 1px solid #c9ced6;
    border-radius: 6px;
    background: #fff;
    font: inherit;
    color: inherit;
    outline: none;
  }
  .field:focus {
    border-color: #3b82f6;
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
  }
  .row { display: flex; gap: 10px; }
  .row .field { flex: 1; }
  .row .amount { flex: 0 0 110px; }
  .btn {
    flex: 1;
    height: 34px;
    border: 1px solid #c9ced6;
    border-radius: 6px;
    background: #fff;
    font: inherit;
    color: inherit;
    cursor: pointer;
  }
  .btn:hover { background: #f0f2f5; }
  .btn.primary {
    border-color: #3b82f6;
    background: #3b82f6;
    color: #fff;
  }
  .btn.primary:hover { background: #2f74e0; }
  .status {
    margin: 0;
    min-height: 20px;
    color: #8b949e;
    word-break: break-word;
  }
  .status.ok { color: #15803d; }
  .status.err { color: #dc2626; }
  .total {
    margin: 0;
    padding: 8px 12px;
    border-radius: 6px;
    background: #eef2f7;
    color: #1f2328;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
  }
  .list {
    flex: 1;
    margin: 0;
    padding: 0;
    overflow-y: auto;
    list-style: none;
    border: 1px solid #e3e6ea;
    border-radius: 6px;
    background: #fff;
  }
  .item {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 12px;
    border-bottom: 1px solid #f0f2f5;
  }
  .item:last-child { border-bottom: 0; }
  .item.alt { background: #fafbfc; }
  .item .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .amount { color: #57606a; font-variant-numeric: tabular-nums; }
  .list .empty { padding: 10px 12px; color: #9aa4b0; }
</style>
</head>
<body>
  <main class="app">
    <div class="row">
      <input id="name-field" class="field" type="text" placeholder="项目（如：午餐）" autocomplete="off">
      <input id="amount-field" class="field amount" type="number" min="0.01" step="0.01" placeholder="金额" value="12.34">
    </div>
    <div class="row">
      <button id="add-button" class="btn primary" type="button">记一笔</button>
      <button id="clear-button" class="btn" type="button">清空</button>
    </div>
    <p id="status-text" class="status">还没有记账</p>
    <p id="total-text" class="total">合计 0.00 元</p>
    <ul id="entry-list" class="list"></ul>
  </main>

<script>
"use strict";

var nameField = document.getElementById("name-field");
var amountField = document.getElementById("amount-field");
var addButton = document.getElementById("add-button");
var clearButton = document.getElementById("clear-button");
var statusText = document.getElementById("status-text");
var totalText = document.getElementById("total-text");
var entryList = document.getElementById("entry-list");

// 样式只认协议里的 level 字段（info / ok / error），
// 不去嗅探 ✅❌ 这类文本前缀——文案可以在后端随便改，界面不受影响。
var STATUS_CLASS = { info: "status", ok: "status ok", error: "status err" };

function renderStatus(response) {
  statusText.textContent = response.status || "";
  statusText.className = STATUS_CLASS[response.level] || "status";
}

// 合计是 core 算出来的业务结果，界面只负责显示，不自己再算一遍。
function renderTotal(response) {
  totalText.textContent = response.total || "合计 0.00 元";
}

// 列表项自带名称和金额，界面按自己的排版方式摆（后端给的是数据，不是 HTML）。
function renderEntries(response) {
  entryList.textContent = "";
  var items = response.entries || [];
  if (items.length === 0) {
    var hint = document.createElement("li");
    hint.className = "empty";
    hint.textContent = "（暂无记录）";
    entryList.appendChild(hint);
    return;
  }
  items.forEach(function (item, index) {
    var li = document.createElement("li");
    li.className = "item" + (index % 2 ? " alt" : "");

    var name = document.createElement("span");
    name.className = "name";
    name.textContent = (index + 1) + ". " + item.name;

    var amount = document.createElement("span");
    amount.className = "amount";
    amount.textContent = item.amount;

    li.appendChild(name);
    li.appendChild(amount);
    entryList.appendChild(li);
  });
}

function applyResponse(response) {
  if (!response) return;
  renderStatus(response);
  renderTotal(response);
  renderEntries(response);
}

// C++ 通过 webview 的 eval() 主动调用这里，把一次操作的事件推给页面。
// error 字段是机器可读的失败原因，需要精确处理某个错误时用它。
window.__onBackendEvent = function (event) {
  console.log("C++ 通知:", event.event, "->", event.detail, "| level =", event.level, "| error =", event.error);
};

// webview 的绑定是在页面脚本之前注入的，这里再等一等，保证 window.getState 已经就绪。
function whenBackendReady(callback) {
  var attempts = 0;
  var timer = setInterval(function () {
    if (typeof window.getState === "function") {
      clearInterval(timer);
      callback();
    } else if (++attempts > 150) {
      clearInterval(timer);
      renderStatus({ status: "❌ 未能连接到 C++ 后端", level: "error" });
    }
  }, 20);
}

whenBackendReady(function () {
  window.getState().then(applyResponse).catch(function (error) {
    renderStatus({ status: "❌ 初始化失败: " + error, level: "error" });
  });

  addButton.addEventListener("click", function () {
    var amount = Number(amountField.value);
    window.addEntry(nameField.value, amount).then(function (response) {
      applyResponse(response);
      if (response.ok) {
        nameField.value = "";
        amountField.value = "12.34";
      }
      nameField.focus();
    });
  });

  nameField.addEventListener("keydown", function (event) {
    if (event.key === "Enter") addButton.click();
  });

  clearButton.addEventListener("click", function () {
    window.clearEntries().then(applyResponse);
  });
});
</script>
</body>
</html>
